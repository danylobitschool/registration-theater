<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theater on Podol feedback</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="stylemobile.css">
</head>
<body>
    <h1 id="title">Theater on Podol descent</h1>
    <p id="description"> Join to our community <br>
        <br>
        Give us your opinion about the newest features in our experimental events.</p>
    </p>
    <form action="" id="survey-form">
        <fieldset>
            <legend>Cotact data</legend>
            <label for="name" id="name-label">Put your firstname here</label>
            <input type="text" name="name" id="name" required>
            <p></p>
            <label for="sname" id="sname-label"> Put your surname here</label>
            <input type="text" name="sname" id="sname">
            <p></p>
            <label for="email" id="email-label"> Your email</label>
            <input type="email" name="email" id="email" required>
        </fieldset> 
        <fieldset>
            <legend>Preferences</legend>
            <label for="number" id="numer-label">How many events are you planing visit next month?</label>
            <input type="number" name="number" id="number" min="0" max="31"><br>
            <p>Which of the new activities above do u prefer?</p>
            <label for="expo">Modern art exposition</label> 
            <input type="checkbox" name="expo" id="expo" value="expo"> <br>
            <label for="photogallery">Photo Gallery</label> 
            <input type="checkbox" name="photogallery" id="photogallery" value="photogallery"><br>
            <label for="scenicwork">Scenic workshop</label> 
            <input type="checkbox" name="scenicwork" id="scenicwork" value="scenicwork"><br>
            <label for="stagemakeup">Stage makeup courses</label> 
            <input type="checkbox" name="stagemakeup" id="stagemakeup" value="stagemakeup"><br>
        </fieldset> 
        <fieldset>
            <legend>Free comment area</legend>
            <textarea name="comments" id="comments"></textarea>
        </fieldset>
        <button type="submit" id="submit">Submit</button>
    </form>
</body>
</html>
